<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameStride Racer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --panel: rgba(12, 12, 16, .82);
      --line: rgba(255, 255, 255, .14);
      --text: #f7f7f8;
      --muted: #a2a5ad;
      --red: #ff2635;
      --orange: #ff8b22;
      --cyan: #64d6ff;
      --green: #35ff9d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 25% 15%, rgba(255, 38, 53, .18), transparent 30%),
        radial-gradient(circle at 80% 42%, rgba(255, 139, 34, .10), transparent 28%),
        #050507;
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: .75;
    }

    button { font: inherit; }

    .game-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 18px;
      gap: 12px;
    }

    .topbar, .bottombar {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--red), var(--orange));
      box-shadow: 0 14px 38px rgba(255, 38, 53, .38);
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .logo::before, .logo::after {
      content: "";
      position: absolute;
      left: 9px;
      right: 9px;
      height: 6px;
      border-radius: 999px;
      background: #07070a;
      transform: skewX(-24deg);
    }

    .logo::before { top: 11px; }
    .logo::after { bottom: 11px; }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: .95;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-top: 4px;
    }

    .hud {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .hud-card {
      min-width: 104px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .34);
    }

    .hud-card span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    .hud-card strong {
      display: block;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1;
      margin-top: 4px;
    }

    .stage {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      overflow: hidden;
      background: #050507;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .52);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 420px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(255,38,53,.18), rgba(5,5,7,.86) 56%),
        rgba(5,5,7,.46);
      transition: opacity .22s ease, visibility .22s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      width: min(680px, 100%);
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(10, 10, 14, .9);
      backdrop-filter: blur(24px);
      border-radius: 8px;
      padding: clamp(20px, 4vw, 36px);
      text-align: center;
      box-shadow: 0 26px 80px rgba(0,0,0,.55);
    }

    .start-card h2 {
      margin: 0;
      font-size: clamp(42px, 8vw, 92px);
      line-height: .86;
      letter-spacing: 0;
    }

    .start-card p {
      max-width: 520px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .btn {
      height: 44px;
      padding: 0 18px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor: pointer;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 12px;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--red), var(--orange));
      border-color: rgba(255, 38, 53, .75);
      box-shadow: 0 16px 38px rgba(255,38,53,.32);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    kbd {
      min-width: 34px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px;
      background: rgba(255,255,255,.075);
      color: #fff;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: none;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.35);
    }

    .stride-meter {
      width: min(420px, 42vw);
      height: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      overflow: hidden;
    }

    .fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--orange));
      box-shadow: 0 0 24px rgba(255,38,53,.55);
      transition: width .12s linear;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-50%) translateY(-12px);
      opacity: 0;
      z-index: 5;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(8,8,12,.86);
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 780px) {
      .game-shell { padding: 10px; }
      .topbar, .bottombar { align-items: flex-start; flex-direction: column; }
      .hud { justify-content: flex-start; width: 100%; }
      .hud-card { min-width: calc(50% - 4px); flex: 1; }
      .stride-meter { width: 100%; }
      .controls { letter-spacing: .08em; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>GameStride Racer</h1>
          <div class="subtitle">fitness-powered arcade demo</div>
        </div>
      </div>
      <div class="hud">
        <div class="hud-card"><span>Score</span><strong id="score">0</strong></div>
        <div class="hud-card"><span>Speed</span><strong id="speed">0</strong></div>
        <div class="hud-card"><span>Combo</span><strong id="combo">x1</strong></div>
        <div class="hud-card"><span>Energy</span><strong id="energy">100</strong></div>
      </div>
    </header>

    <section class="stage" id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div class="toast" id="toast">Gate hit</div>
      <div class="overlay" id="overlay">
        <div class="start-card">
          <div class="subtitle">GameStride Core connected</div>
          <h2>Move to race.</h2>
          <p>Hold the stride key to generate speed. Steer through light gates, avoid hazard blocks, and keep your combo alive.</p>
          <div class="actions">
            <button class="btn primary" id="startBtn">Start Game</button>
            <button class="btn" id="demoBtn">Autoplay Demo</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="bottombar">
      <div class="controls">
        <span>Stride</span><kbd>W</kbd><kbd>↑</kbd><span>Steer</span><kbd>A</kbd><kbd>D</kbd><kbd>←</kbd><kbd>→</kbd><span>Pause</span><kbd>Space</kbd>
      </div>
      <div class="stride-meter" aria-label="Stride power"><div class="fill" id="strideFill"></div></div>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const demoBtn = document.getElementById('demoBtn');
    const toast = document.getElementById('toast');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const comboEl = document.getElementById('combo');
    const energyEl = document.getElementById('energy');
    const strideFill = document.getElementById('strideFill');

    const input = {
      stride: false,
      left: false,
      right: false
    };

    const state = {
      mode: 'menu',
      autoplay: false,
      t: 0,
      playerX: 0,
      playerV: 0,
      speed: 0,
      stride: 0,
      energy: 100,
      score: 0,
      combo: 1,
      distance: 0,
      shake: 0,
      spawnGate: 0,
      spawnHazard: 0,
      gates: [],
      hazards: [],
      particles: [],
      trail: []
    };

    function resize() {
      const r = stage.getBoundingClientRect();
      canvas.width = r.width * devicePixelRatio;
      canvas.height = r.height * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
    }

    new ResizeObserver(resize).observe(stage);
    resize();

    function startGame(auto = false) {
      Object.assign(state, {
        mode: 'playing',
        autoplay: auto,
        t: 0,
        playerX: 0,
        playerV: 0,
        speed: 0,
        stride: 0,
        energy: 100,
        score: 0,
        combo: 1,
        distance: 0,
        shake: 0,
        spawnGate: 220,
        spawnHazard: 350,
        gates: [],
        hazards: [],
        particles: [],
        trail: []
      });
      overlay.classList.add('hidden');
    }

    startBtn.addEventListener('click', () => startGame(false));
    demoBtn.addEventListener('click', () => startGame(true));

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        if (state.mode === 'menu' || state.mode === 'over') { startGame(false); return; }
        if (state.mode === 'playing') { state.mode = 'paused'; return; }
        if (state.mode === 'paused') { state.mode = 'playing'; return; }
      }
      if (['KeyW','ArrowUp'].includes(e.code))    input.stride = true;
      if (['KeyA','ArrowLeft'].includes(e.code))  input.left   = true;
      if (['KeyD','ArrowRight'].includes(e.code)) input.right  = true;
    });
    document.addEventListener('keyup', e => {
      if (['KeyW','ArrowUp'].includes(e.code))    input.stride = false;
      if (['KeyA','ArrowLeft'].includes(e.code))  input.left   = false;
      if (['KeyD','ArrowRight'].includes(e.code)) input.right  = false;
    });

    let toastTimer = 0;
    function showToast(msg, color = '#fff') {
      toast.textContent = msg;
      toast.style.color = color;
      toast.classList.add('show');
      toastTimer = 90;
    }

    const W = () => canvas.width / devicePixelRatio;
    const H = () => canvas.height / devicePixelRatio;

    function laneX(lane) {
      const lanes = 5;
      const tw = W() * .72;
      const pad = (W() - tw) / 2;
      return pad + (lane / (lanes - 1)) * tw;
    }

    function spawnGate() {
      const lanes = 5;
      const open = Math.floor(Math.random() * lanes);
      const segs = [];
      if (open > 0)   segs.push({ x: laneX(0), w: laneX(open - 1) - laneX(0) + 26 });
      if (open < lanes - 1) segs.push({ x: laneX(open + 1) - 4, w: laneX(lanes - 1) - laneX(open + 1) + 26 });
      return { y: -60, open: laneX(open), segs, age: 0 };
    }

    function spawnHazard() {
      const lanes = 5;
      const lane = Math.floor(Math.random() * lanes);
      return { x: laneX(lane), y: -40, lane, age: 0 };
    }

    function emit(x, y, color, n = 12) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 5;
        state.particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 3, life: 1, color, r: 2+Math.random()*4 });
      }
    }

    function autoControl() {
      if (!state.autoplay) return;
      input.stride = state.energy > 20;
      const nx = state.gates.length ? state.gates[0].open : W() / 2;
      const px = laneX(2) + state.playerX * (W() * .72 / 4);
      input.left  = nx < px - 20;
      input.right = nx > px + 20;
    }

    function update() {
      if (state.mode !== 'playing') return;
      state.t++;
      autoControl();

      const strideActive = input.stride && state.energy > 0;
      if (strideActive) {
        state.stride = Math.min(1, state.stride + .028);
        state.energy = Math.max(0, state.energy - .55);
      } else {
        state.stride = Math.max(0, state.stride - .018);
        state.energy = Math.min(100, state.energy + .22);
      }

      strideFill.style.width = (state.stride * 100) + '%';

      const baseSpeed = 3.2;
      const targetSpeed = baseSpeed + state.stride * 7.5;
      state.speed += (targetSpeed - state.speed) * .12;

      const steerForce = .018;
      if (input.left)  state.playerV -= steerForce;
      if (input.right) state.playerV += steerForce;
      state.playerV *= .82;
      state.playerX = Math.max(-2.1, Math.min(2.1, state.playerX + state.playerV));

      state.distance += state.speed;
      state.score += Math.floor(state.speed * state.combo * .04);

      const spd = state.speed;

      state.spawnGate -= spd;
      if (state.spawnGate <= 0) {
        state.gates.push(spawnGate());
        state.spawnGate = 240 + Math.random() * 160;
      }

      state.spawnHazard -= spd;
      if (state.spawnHazard <= 0) {
        state.hazards.push(spawnHazard());
        state.spawnHazard = 280 + Math.random() * 200;
      }

      const px = laneX(2) + state.playerX * (W() * .72 / 4);
      const py = H() * .74;

      for (const g of state.gates) {
        g.y += spd;
        g.age++;
        if (!g.hit && g.y > py - 14 && g.y < py + 14) {
          let blocked = false;
          for (const s of g.segs) {
            if (px > s.x - 8 && px < s.x + s.w + 8) blocked = true;
          }
          if (!blocked) {
            g.hit = true;
            state.combo = Math.min(16, state.combo + 1);
            state.score += state.combo * 50;
            emit(g.open, g.y, '#64d6ff', 18);
            showToast('Gate! x' + state.combo, '#64d6ff');
          } else {
            g.hit = true;
            state.combo = 1;
            state.shake = 12;
            emit(px, py, '#ff2635', 16);
            showToast('Blocked!', '#ff2635');
          }
        }
      }

      for (const h of state.hazards) {
        h.y += spd;
        h.age++;
        if (!h.hit && h.y > py - 20 && h.y < py + 20) {
          const hx = laneX(h.lane);
          if (Math.abs(px - hx) < 26) {
            h.hit = true;
            state.energy = Math.max(0, state.energy - 28);
            state.combo = 1;
            state.shake = 20;
            emit(px, py, '#ff8b22', 22);
            showToast('Hazard!', '#ff8b22');
          }
        }
      }

      state.gates    = state.gates.filter(g => g.y < H() + 80);
      state.hazards  = state.hazards.filter(h => h.y < H() + 80);

      state.trail.push({ x: px, y: py, a: 1 });
      if (state.trail.length > 32) state.trail.shift();

      for (const p of state.particles) {
        p.x += p.vx; p.y += p.vy; p.vy += .18; p.life -= .04;
      }
      state.particles = state.particles.filter(p => p.life > 0);

      if (state.shake > 0) state.shake--;
      if (toastTimer > 0 && --toastTimer === 0) toast.classList.remove('show');

      scoreEl.textContent = state.score.toLocaleString();
      speedEl.textContent = Math.round(state.speed * 10);
      comboEl.textContent = 'x' + state.combo;
      energyEl.textContent = Math.round(state.energy);
    }

    function draw() {
      const w = W(), h = H();
      ctx.clearRect(0, 0, w, h);

      ctx.save();
      if (state.shake > 0) {
        ctx.translate(
          (Math.random() - .5) * state.shake * .7,
          (Math.random() - .5) * state.shake * .5
        );
      }

      const trackLeft  = laneX(0);
      const trackRight = laneX(4);

      const horizon = h * .22;
      const vanishX = w / 2;

      ctx.strokeStyle = 'rgba(255,255,255,.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const bx = laneX(i);
        ctx.beginPath();
        ctx.moveTo(vanishX + (bx - vanishX) * .05, horizon);
        ctx.lineTo(bx, h);
        ctx.stroke();
      }

      const dashCount = 18;
      const scroll = (state.distance * .95) % (h / dashCount);
      ctx.strokeStyle = 'rgba(255,255,255,.13)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([14, 22]);
      for (let i = 1; i <= 3; i++) {
        const x1 = laneX(i);
        ctx.beginPath();
        ctx.moveTo(vanishX + (x1 - vanishX) * .05, horizon);
        ctx.lineTo(x1, h);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      for (const g of state.gates) {
        const alpha = g.hit ? .3 : .9;
        ctx.globalAlpha = alpha;
        for (const s of g.segs) {
          const grad = ctx.createLinearGradient(s.x, g.y - 10, s.x, g.y + 10);
          grad.addColorStop(0, g.hit ? '#333' : '#64d6ff');
          grad.addColorStop(1, 'rgba(100,214,255,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(s.x, g.y - 8, s.w, 8);
          ctx.fillStyle = g.hit ? 'rgba(100,214,255,.12)' : 'rgba(100,214,255,.22)';
          ctx.fillRect(s.x, g.y, s.w, 4);
        }
        ctx.globalAlpha = 1;
      }

      for (const h2 of state.hazards) {
        const pulse = Math.sin(h2.age * .2) * .3 + .7;
        ctx.globalAlpha = h2.hit ? .2 : pulse;
        const hx = laneX(h2.lane) - 18;
        const hy = h2.y - 18;
        ctx.fillStyle = '#ff8b22';
        ctx.beginPath();
        ctx.roundRect(hx, hy, 36, 36, 5);
        ctx.fill();
        ctx.fillStyle = '#050507';
        ctx.fillRect(hx + 9, hy + 15, 18, 6);
        ctx.fillRect(hx + 15, hy + 9, 6, 18);
        ctx.globalAlpha = 1;
      }

      for (let i = 1; i < state.trail.length; i++) {
        const t = state.trail[i];
        const prev = state.trail[i - 1];
        ctx.strokeStyle = `rgba(255,38,53,${t.a * (i / state.trail.length) * .5})`;
        ctx.lineWidth = 3 * (i / state.trail.length);
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(t.x, t.y);
        ctx.stroke();
      }

      const px = laneX(2) + state.playerX * (w * .72 / 4);
      const py = h * .74;

      ctx.shadowColor = '#ff2635';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(px, py - 22);
      ctx.lineTo(px - 14, py + 18);
      ctx.lineTo(px, py + 10);
      ctx.lineTo(px + 14, py + 18);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      for (const p of state.particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      if (state.mode === 'paused') {
        ctx.fillStyle = 'rgba(5,5,7,.62)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${clamp(32, 6, 64)}px Inter, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', w / 2, h / 2);
        ctx.font = `14px Inter, sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.fillText('Press Space to resume', w / 2, h / 2 + 36);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function clamp(base, vw, max) {
      return Math.min(max, Math.max(base, base + vw * W() / 100));
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
