<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScholarPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column under a sticky tab bar; profile uses a step rail + form, everything else is a ranked list of award cards. */
:root {
  --paper: #f3f6f9;
  --surface: #ffffff;
  --sunken: #e9eef4;
  --ink: #132238;
  --muted: #5a667a;
  --line: #d6dde7;
  --accent: #17654f;
  --accent-soft: #dcefe8;
  --on-accent: #ffffff;
  --gold: #8a5d0f;
  --gold-soft: #f6ebd3;
  --good: #1c7a4b;
  --good-soft: #def2e6;
  --warn: #93600a;
  --warn-soft: #fbefd6;
  --bad: #a83a30;
  --bad-soft: #f8e0dd;
  --focus: #2f7cf6;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d131d; --surface: #141c29; --sunken: #1b2534; --ink: #e6ecf4; --muted: #9aa6b9; --line: #273346;
    --accent: #52c3a0; --accent-soft: #173a31; --on-accent: #06231b; --gold: #e3b45c; --gold-soft: #3a2e17;
    --good: #63cf95; --good-soft: #163526; --warn: #e6b350; --warn-soft: #3a2d12; --bad: #f0857a; --bad-soft: #3d1d1a; --focus: #7aa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d131d; --surface: #141c29; --sunken: #1b2534; --ink: #e6ecf4; --muted: #9aa6b9; --line: #273346;
  --accent: #52c3a0; --accent-soft: #173a31; --on-accent: #06231b; --gold: #e3b45c; --gold-soft: #3a2e17;
  --good: #63cf95; --good-soft: #163526; --warn: #e6b350; --warn-soft: #3a2d12; --bad: #f0857a; --bad-soft: #3d1d1a; --focus: #7aa8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-block: 14px 6px; }
.brand h1 { font-size: 1.5rem; }
.brand .tag { font-size: 0.85rem; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: 600 0.92rem var(--font-body); padding: 10px 12px; border-bottom: 3px solid transparent; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font: 500 0.75rem var(--font-data); background: var(--sunken); border-radius: 99px; padding: 1px 7px; margin-left: 4px; }

main { padding-block: 22px 60px; }
.banner { background: var(--gold-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius: var(--r); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.banner p { flex: 1 1 280px; min-width: 0; }

/* controls */
button, .btn { font: 600 0.9rem var(--font-body); border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--muted); }
.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.primary:hover { filter: brightness(1.07); border-color: var(--accent); }
.ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: 400 0.95rem var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
label.q { display: block; font-weight: 600; margin-bottom: 6px; }
.help { color: var(--muted); font-size: 0.84rem; margin-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; user-select: none; }
.chips input { width: auto; accent-color: var(--accent); margin: 0; }
.chips label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.field { min-width: 0; }
.field.flash { animation: flash 1.4s ease; border-radius: 8px; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--gold-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* profile wizard */
.wizard { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 120px; }
.steps button { width: 100%; justify-content: space-between; border: 0; background: none; padding: 8px 10px; font-weight: 500; color: var(--muted); }
.steps button[aria-current="step"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.steps .pct { font: 500 0.75rem var(--font-data); }
.steps .pct.done { color: var(--good); }
.progress { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.formcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
.grid2 .wide { grid-column: 1 / -1; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

/* summary + cards */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.tile b { display: block; font: 500 1.5rem var(--font-data); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 0.84rem; }
.unlock { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--r); padding: 14px 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; border-radius: 0; padding: 7px 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card .head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.card .head > div { min-width: 0; }
.amt { font: 500 0.92rem var(--font-data); color: var(--gold); text-align: right; max-width: 45%; flex: none; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 0.74rem var(--font-body); letter-spacing: .04em; text-transform: uppercase; border-radius: 99px; padding: 3px 9px; background: var(--sunken); color: var(--muted); }
.pill.eligible { background: var(--good-soft); color: var(--good); }
.pill.maybe { background: var(--warn-soft); color: var(--warn); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 0.88rem; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 4px; }
.checks .m { font-family: var(--font-data); font-weight: 600; }
.checks .pass .m { color: var(--good); }
.checks .fail .m { color: var(--bad); }
.checks .unknown .m, .checks .todo .m { color: var(--warn); }
.card .foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.verify { font-size: 0.78rem; color: var(--muted); }

/* queue / kit */
details.kit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.kit > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 38%); gap: 12px; align-items: center; }
details.kit > summary .amt { max-width: none; }
details.kit > summary::-webkit-details-marker { display: none; }
details.kit[open] > summary { border-bottom: 1px solid var(--line); }
.rank { font: 500 0.9rem var(--font-data); color: var(--muted); text-align: center; }
.kitbody { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.kitstep { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.kitstep .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 0.82rem var(--font-data); display: grid; place-items: center; }
.kitstep > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.fact { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--sunken); border-radius: 8px; padding: 6px 6px 6px 10px; font-size: 0.86rem; min-width: 0; }
.fact span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fact em { font-style: normal; color: var(--muted); margin-right: 6px; }
.fact button { padding: 3px 8px; font-size: 0.78rem; flex: none; }
.essaymatch { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }

/* essays */
.essay { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.essay textarea { min-height: 150px; }

/* autofill */
.bm { display: inline-flex; align-items: center; gap: 8px; font: 600 1rem var(--font-body); padding: 12px 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent); text-decoration: none; border: 2px dashed color-mix(in srgb, var(--on-accent) 50%, transparent); cursor: grab; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
ol.how { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* tracker */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 0.9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 600 0.74rem var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--sunken); }
tr:last-child td { border-bottom: 0; }
td select, td input { padding: 6px 8px; font-size: 0.86rem; }
.warnbox { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
.okbox { background: var(--good-soft); color: var(--good); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 26px; text-align: center; color: var(--muted); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

@media (max-width: 820px) {
  .wizard { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .steps { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .steps li { flex: none; }
  .steps button { white-space: nowrap; gap: 8px; }
  .cards, .cols { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .formcard { padding: 16px; }
  h2 { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

  </div>`;
}

/* Matches */
let matchFilter = 'eligible', showHidden = false, matchQuery = '';
function checksHTML(checks) {

const STATUS_LABEL = { eligible:'Eligible', maybe:'Maybe', no:'Not eligible' };

    </div></div>
  </article>`;
}
function viewMatches() {
  const p = P(), R = results();
  const vis = R.filter(r => showHidden || !r.hidden);
  const counts = { eligible: vis.filter(r => r.status === 'eligible').length, maybe: vis.filter(r => r.status === 'maybe').length, no: vis.filter(r => r.status === 'no').length };
  const openElig = vis.filter(r => r.status === 'eligible' && r.rd.state !== 'closed');
  const closedElig = vis.filter(r => r.status === 'eligible' && r.rd.state === 'closed').length;
  const potential = openElig.filter(r => r.s.kind !== 'sweepstakes').reduce((a, r) => a + (r.s.typical || r.s.amountMax || 0), 0);
  const portals = ALL().filter(s => s.portal && !(s.kind === 'sweepstakes' && p.includeSweeps === 'no'));
  const hiddenCount = R.filter(r => r.hidden && r.status !== 'no').length;
  const missing = {};
  R.filter(r => r.status === 'maybe').forEach(r => r.checks.forEach(c => { if (c.state === 'unknown' && c.field) missing[c.field] = (missing[c.field] || 0) + 1; }));
  const unlock = Object.entries(missing).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const q = matchQuery.toLowerCase();
  const list = vis.filter(r => (matchFilter === 'all' || r.status === matchFilter) && (!q || (r.s.name + ' ' + r.s.org + ' ' + (r.s.notes || '')).toLowerCase().includes(q)))
    .sort((a, b) => ({ eligible:0, maybe:1, no:2 }[a.status] - { eligible:0, maybe:1, no:2 }[b.status]) || ((a.rd.state === 'closed') - (b.rd.state === 'closed')) || b.score - a.score);
  return `<div class="stack" style="gap:18px">
    <div><h2>Your matches</h2><p class="muted">Checked ${R.length} national scholarships and grants against your profile${usingSample() ? ' (sample student)' : ''}. Award details were reviewed in October 2026; always confirm on the official site.</p></div>
    <div class="tiles">
      <div class="tile"><b>${openElig.length}</b><span>Eligible and still open${closedElig ? ` (+${closedElig} closed this cycle)` : ''}</span></div>
      <div class="tile"><b>${counts.maybe}</b><span>Maybe: answer a question</span></div>
      <div class="tile"><b>${money(potential)}</b><span>Typical value of the open awards you qualify for</span></div>
      <div class="tile"><b>${overallProgress(p).pct}%</b><span>Profile complete</span></div>
    </div>
    ${unlock.length ? `<div class="unlock stack" style="gap:8px"><b>Answer these to check ${Object.values(missing).reduce((a, b) => a + b, 0)} more possible matches</b><div class="row">${unlock.map(([k, n]) => `<button data-goto="${k}">${esc(FIELD[k] ? FIELD[k].label : k)} <span class="muted mono small">+${n}</span></button>`).join('')}</div></div>` : ''}
    <div class="spread">
      <div class="seg" role="group" aria-label="Filter">${[['eligible', 'Eligible'], ['maybe', 'Maybe'], ['no', 'Not eligible'], ['all', 'All']].map(([k, l]) => `<button data-filter="${k}" aria-pressed="${matchFilter === k}">${l}${k !== 'all' ? ` <span class="mono">${counts[k]}</span>` : ''}</button>`).join('')}</div>
      <div class="row" style="flex:1 1 240px;justify-content:flex-end"><input id="matchSearch" type="search" placeholder="Search scholarships" value="${esc(matchQuery)}" style="max-width:260px"></div>
    </div>
    ${hiddenCount ? `<label class="small row" style="gap:6px"><input type="checkbox" id="showHidden" style="width:auto" ${showHidden ? 'checked' : ''}> Show ${hiddenCount} hidden by your preferences</label>` : ''}
    ${list.length ? `<div class="cards">${list.map(cardHTML).join('')}</div>` : `<div class="empty">Nothing in this list yet. ${matchFilter === 'eligible' ? 'Answer more profile questions or check the Maybe tab.' : ''}</div>`}
    ${portals.length ? `<div class="panel"><h3>Directories to search</h3><p class="muted">Each of these holds many awards with their own rules and dates, so ScholarPilot can't match them for you. Search them, then add the specific awards you find on the Tracker tab.</p><div class="stack" style="gap:8px">${portals.map(s => `<div class="spread" style="border-top:1px solid var(--line);padding-top:8px"><div style="min-width:0;flex:1 1 260px"><b>${esc(s.name)}</b>${s.kind === 'sweepstakes' ? ' <span class="pill">drawing</span>' : ''}<p class="small muted">${esc(s.notes)}</p></div><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Search</a></div>`).join('')}</div></div>` : ''}
    <div class="panel"><h3>Where the easiest money is: local scholarships</h3><p class="muted">National awards get thousands of applicants. Local ones often get a handful. Check each of these, then add what you find on the Tracker tab.</p><ul style="margin:0;padding-left:20px">${LOCAL_SOURCES.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>

/* Apply queue */
const FACT_KEYS = [['fullName','Full name'],['email','Email'],['phone','Phone'],['dobUS','Birthday'],['collegeGpa','College GPA'],['street','Street'],['city','City'],['state','State'],['zip','ZIP'],['highSchool','High school'],['hsGradYear','Grad year'],['gpa','GPA (unweighted)'],['gpaWeighted','GPA (weighted)'],['sat','SAT'],['act','ACT'],['college','College'],['major','Major'],['careerGoal','Career goal'],['volunteerHours','Volunteer hours']];

  const p = P();
  if (p.activities) rows.push(`<div class="fact"><span><em>Activities</em>${esc(String(p.activities).split('\n')[0])}…</span><button data-copy="${esc(p.activities)}" data-what="Activities">Copy</button></div>`);

    <div class="kitstep"><span class="n">2</span><div><b>Autofill the form</b><p class="small muted">Click your ScholarPilot bookmark on the application page. It fills the basic fields it's sure about and lists them. Copy anything else from here.</p>${factsHTML()}</div></div>

  </div>`;

        <hr class="sep">
        <h3>Start over</h3>
        ${confirmClear ? `<div class="warnbox">This deletes your profile, essays and tracker from this browser. It can't be undone.</div><div class="row"><button class="danger" data-act="clearyes">Yes, delete everything</button><button data-act="clearno">Cancel</button></div>` : `<div><button class="danger" data-act="clear">Delete all my data</button></div>`}
      </div>
    </div>
  </div>`;
}
let confirmClear = false;

/* ------------------------------------------------------------------ *
 * Actions
 * ------------------------------------------------------------------ */
function setTab(t) { S.tab = t; save(); render(); window.scrollTo(0, 0); }
function gotoField(k) {
  const f = FIELD[k]; if (!f) return;
  if (usingSample()) { toast('Start your own profile first'); }
  S.tab = 'profile'; S.step = f.step; save(); render();
  const el = document.querySelector(`[data-field="${k}"]`);
  if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); const inp = el.querySelector('input, select, textarea'); if (inp && !inp.disabled) inp.focus({ preventScroll: true }); }
}
function track(id, status) {
  const s = ALL().find(x => x.id === id), rd = s ? roundOf(s) : {};
  S.tracker[id] = Object.assign({ status: 'todo', deadline: rd.state === 'closed' ? '' : (rd.closes || '') }, S.tracker[id] || {}, status ? { status } : {}); save();
}
function icsText() {
  const byId = {}; ALL().forEach(s => { byId[s.id] = s; });
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const ev = Object.entries(S.tracker).filter(([id, t]) => t.deadline && byId[id] && !['skip', 'lost', 'won'].includes(t.status)).map(([id, t]) => {
    const d = t.deadline.replace(/-/g, ''), s = byId[id];
    const next = new Date(t.deadline + 'T00:00:00'); next.setDate(next.getDate() + 1);
    const d2 = next.toISOString().slice(0, 10).replace(/-/g, '');
    const clean = x => String(x || '').replace(/[,;\\]/g, ' ');
    return ['BEGIN:VEVENT', 'UID:' + id + '-' + d + '@scholarpilot', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + d2, 'SUMMARY:DUE: ' + clean(s.name), 'DESCRIPTION:' + clean(s.amount) + ' ' + clean(s.url), 'BEGIN:VALARM', 'TRIGGER:-P7D', 'ACTION:DISPLAY', 'DESCRIPTION:Scholarship due in 1 week', 'END:VALARM', 'END:VEVENT'].join('\r\n');
  });
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ScholarPilot//EN'].concat(ev, ['END:VCALENDAR']).join('\r\n');
}
function restore(text) {
  try {
    const d = JSON.parse(text);
    if (!d || typeof d !== 'object' || !('profile' in d)) throw new Error('not a backup');
    Object.assign(S, { profile: d.profile, essays: d.essays || {}, tracker: d.tracker || {}, custom: d.custom || [], prefs: d.prefs || S.prefs });
    save(); render(); toast('Backup restored');
  } catch (e) { toast('That is not a ScholarPilot backup. Check you pasted the whole thing.'); }
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button, a[data-gotab]');
  if (!b) return;
  const d = b.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.step != null) { S.step = +d.step; save(); render(); return; }
  if (d.goto) return gotoField(d.goto);
  if (d.filter) { matchFilter = d.filter; render(); return; }
  if (d.track) { track(d.track); toast('Added to your queue'); render(); return; }
  if (d.copy != null) return copy(d.copy, d.what);
  if (d.copyEssay) return copy(E()[d.copyEssay] || '', 'Essay');
  if (d.tailor) { const [id, th] = d.tailor.split('|'); const s = ALL().find(x => x.id === id); return copy(tailorPrompt(s, th, E()[th] || ''), 'Tailoring prompt'); }
  if (d.gotab) { S.tab = d.gotab; save(); render(); const el = d.theme && document.getElementById('essay-' + d.theme); if (el) { el.scrollIntoView({ block: 'start' }); const ta = el.querySelector('textarea'); if (ta && !ta.disabled) ta.focus({ preventScroll: true }); } return; }
  if (d.status) { const [id, st] = d.status.split('|'); track(id, st); toast(st === 'submitted' ? 'Marked submitted. Nice work.' : 'Updated'); render(); return; }
  switch (d.act) {
    case 'start': S.profile = {}; S.essays = {}; S.tab = 'profile'; S.step = 0; save(); render(); window.scrollTo(0, 0); setTimeout(() => { const f = $('#f-firstName'); if (f) f.focus(); }, 0); break;
    case 'prev': S.step = Math.max(0, S.step - 1); save(); render(); window.scrollTo(0, 0); break;
    case 'next': S.step = Math.min(STEPS.length - 1, S.step + 1); save(); render(); window.scrollTo(0, 0); break;
    case 'finish': setTab('matches'); break;
    case 'copybm': copy(bookmarkletHref(), 'Bookmark code'); break;
    case 'ics': download('scholarship-deadlines.ics', icsText(), 'text/calendar'); break;
    case 'icscopy': copy(icsText(), 'Calendar text'); break;
    case 'export': download('scholarpilot-backup.json', JSON.stringify({ profile: S.profile, essays: S.essays, tracker: S.tracker, custom: S.custom, prefs: S.prefs }, null, 2), 'application/json'); break;
    case 'exportcopy': copy(JSON.stringify({ profile: S.profile, essays: S.essays, tracker: S.tracker, custom: S.custom, prefs: S.prefs }), 'Backup'); break;
    case 'import': restore($('#importText').value); break;
    case 'importlist': {
      try {
        const arr = JSON.parse($('#importList').value); if (!Array.isArray(arr)) throw 0;
        let n = 0;
        arr.forEach((x, i) => { if (!x || !x.name) return; const id = 'c-' + Date.now() + '-' + i; S.custom.push({ id, custom: true, name: String(x.name), org: x.org || '', url: x.url || '', amount: x.amountMax ? money(x.amountMax) : (x.amount || 'Varies'), amountMax: num(x.amountMax) || 1000, effort: x.effort || 'essay', themes: x.themes || [], rules: x.rules || {}, kind: 'scholarship', docs: x.docs || [], notes: x.notes || '' }); if (x.deadline) S.tracker[id] = { status: 'todo', deadline: x.deadline }; n++; });
        save(); render(); toast('Imported ' + n + ' scholarships');
      } catch (e) { toast('Could not read that list. It must be a JSON array.'); }
      break;
    }
    case 'clear': confirmClear = true; render(); break;
    case 'clearno': confirmClear = false; render(); break;
    case 'clearyes': confirmClear = false; try { localStorage.removeItem(KEY); } catch (e) {} Object.assign(S, { profile: null, essays: {}, tracker: {}, custom: [], prefs: { includeBio: false, includeRefs: false }, tab: 'matches', step: 0 }); render(); toast('All data deleted'); break;
  }
});

function onProfileInput(t) {
  if (usingSample()) return;
  const k = t.dataset.k; const p = S.profile;
  if (t.dataset.multi) {
    const vals = Array.from(document.querySelectorAll(`input[data-k="${k}"]:checked`)).map(x => x.value);
    if (t.value === 'none' && t.checked) vals.splice(0, vals.length, 'none');
    else { const i = vals.indexOf('none'); if (i > -1) vals.splice(i, 1); }
    p[k] = vals;
    document.querySelectorAll(`input[data-k="${k}"]`).forEach(x => { x.checked = vals.includes(x.value); });
  } else p[k] = t.value;
  save();
}
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.k) { onProfileInput(t); renderTabs(); return; }
  if (t.dataset.essay) { if (usingSample()) return; S.essays[t.dataset.essay] = t.value; save(); const w = document.querySelector(`[data-wc="${t.dataset.essay}"]`); if (w) w.textContent = words(t.value); return; }
  if (t.id === 'matchSearch') { matchQuery = t.value; const pos = t.selectionStart; render(); const n = $('#matchSearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (t.dataset.note) { S.tracker[t.dataset.note].notes = t.value; save(); return; }
  if (t.dataset.won) { S.tracker[t.dataset.won].wonAmount = t.value; save(); return; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.k) {
    // conditional questions may appear or disappear
    if (['gradeLevel', 'ethnicity', 'works', 'research'].includes(t.dataset.k)) { const y = window.scrollY; render(); window.scrollTo(0, y); }
    return;
  }
  if (t.dataset.deadline) { track(t.dataset.deadline); S.tracker[t.dataset.deadline].deadline = t.value; save(); toast('Deadline saved'); return; }
  if (t.dataset.tstatus) { S.tracker[t.dataset.tstatus].status = t.value; save(); render(); return; }
  if (t.id === 'showHidden') { showHidden = t.checked; render(); return; }
  if (t.id === 'incBio') { S.prefs.includeBio = t.checked; save(); render(); return; }
  if (t.id === 'incRefs') { S.prefs.includeRefs = t.checked; save(); render(); return; }
  if (t.id === 'importFile' && t.files[0]) { const r = new FileReader(); r.onload = () => { $('#importText').value = r.result; }; r.readAsText(t.files[0]); }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'profileForm') return;
  if (ev.target.id !== 'addForm') return;
  const f = ev.target;
  const scams = f.querySelectorAll('input[name="c-scam"]:checked');
  if (scams.length) { scamWarn = 'Stop: real scholarships never charge fees, need your bank or Social Security number up front, or guarantee a win. Don\'t apply to this one, and tell your counselor about it.'; render(); return; }
  scamWarn = '';
  const name = $('#c-name').value.trim(); if (!name) return;
  const grades = Array.from(f.querySelectorAll('input[name="c-grade"]:checked')).map(x => x.value);
  const themes = Array.from(f.querySelectorAll('input[name="c-theme"]:checked')).map(x => x.value);
  const amt = num($('#c-amount').value), gpaMin = num($('#c-gpa').value), id = 'c-' + Date.now();
  const rules = {}; if (grades.length) rules.grades = grades; if (gpaMin) rules.minGpa = gpaMin;
  S.custom.push({ id, custom: true, name, org: $('#c-org').value.trim(), url: $('#c-url').value.trim(), amount: amt ? money(amt) : 'Varies', amountMax: amt || 1000, effort: $('#c-effort').value, themes, rules, kind: 'scholarship', docs: [], notes: '' });
  S.tracker[id] = { status: 'todo', deadline: $('#c-deadline').value };
  save(); render(); toast('Added ' + name);
});

if (S.tab === 'profile' && usingSample()) S.tab = 'matches';
render();
</script>
</body>
</html>
